<svg width="100%" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;display=swap');

      @keyframes slow-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .flake-spin {
        transform-origin: 0px 0px;
        animation: slow-rotate 40s linear infinite;
      }

      .hero-title {
        font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        fill: #fafafa;
      }

      .hero-quote {
        font-family: ui-monospace, SFMono-Regular, "Liberation Mono", Menlo, Consolas, monospace;
        font-size: 13.5px;
        letter-spacing: 0.12em;
        fill: #71717a;
        font-style: italic;
      }

      .hero-sub {
        font-family: 'Orbitron', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.4em;
        fill: #3f3f46;
      }
    </style>
  </defs>

