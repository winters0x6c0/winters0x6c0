<svg width="100%" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink-cursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink-cursor 1s infinite; fill: #ffffff; }
      .term-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        fill: #d4d4d8;
        line-height: 1.5;
      }
      .term-dim { fill: #52525b; }
      .term-bright { fill: #ffffff; font-weight: bold; }
    </style>
  </defs>

  <rect width="800" height="220" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>

  <!-- Terminal Window Bar -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#18181b" stroke-width="1"/>
  <circle cx="24" cy="18" r="4" fill="#27272a"/>
  <circle cx="40" cy="18" r="4" fill="#27272a"/>
  <circle cx="56" cy="18" r="4" fill="#27272a"/>
  <text x="400" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#52525b">winters@void:~</text>

  <!-- Shell Output -->
  <text x="32" y="70" class="term-text"><tspan class="term-dim">~/sanctuary $</tspan> cat identity.json</text>
  <text x="32" y="98" class="term-text">{</text>
  <text x="56" y="122" class="term-text">"author": <tspan class="term-bright">"Winters"</tspan>,</text>
  <text x="56" y="146" class="term-text">"focus": <tspan class="term-dim">["terminal ergonomics", "acoustic systems", "local-first"]</tspan>,</text>
  <text x="56" y="170" class="term-text">"status": <tspan class="term-bright">"online"</tspan></text>
  <text x="32" y="194" class="term-text">}<rect x="42" y="182" width="8" height="15" class="cursor"/></text>
</svg>
