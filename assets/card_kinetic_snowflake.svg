<svg width="100%" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slow-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.85; }
      }
      @keyframes pulse-crystal {
        0%, 100% { transform: scale(0.98); opacity: 0.75; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      .flake-wrap {
        transform-origin: 400px 200px;
        animation: slow-spin 80s linear infinite;
      }
      .crystal-pulse {
        transform-origin: 400px 200px;
        animation: pulse-crystal 6s ease-in-out infinite;
      }
      .s1 { animation: twinkle 3.5s ease-in-out infinite; }
      .s2 { animation: twinkle 5s ease-in-out infinite 1s; }
      .s3 { animation: twinkle 4.2s ease-in-out infinite 2s; }
      .s4 { animation: twinkle 6s ease-in-out infinite 0.5s; }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
        font-weight: 300;
        font-size: 24px;
        letter-spacing: 0.45em;
        text-transform: uppercase;
        fill: #fafafa;
      }
      .sub {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.25em;
        fill: #71717a;
      }
      .quote {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        fill: #a1a1aa;
        font-style: italic;
      }
      .box-hdr {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.15em;
        fill: #52525b;
      }
      .box-txt {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.05em;
        fill: #d4d4d8;
      }
      .box-dim {
        fill: #71717a;
      }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="800" height="520" rx="12" fill="#09090b" stroke="#1f1f23" stroke-width="1"/>

  <!-- Subtle Constellation Background Field -->
  <circle cx="100" cy="80" r="1" fill="#ffffff" class="s1"/>
  <circle cx="180" cy="190" r="1.2" fill="#ffffff" class="s2"/>
  <circle cx="140" cy="360" r="0.8" fill="#ffffff" class="s3"/>
  <circle cx="280" cy="90" r="1" fill="#ffffff" class="s4"/>
  <circle cx="530" cy="70" r="1.2" fill="#ffffff" class="s1"/>
