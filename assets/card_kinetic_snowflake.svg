  <circle cx="640" cy="380" r="1" fill="#ffffff" class="s2"/>
  <circle cx="720" cy="240" r="1.2" fill="#ffffff" class="s4"/>
  <circle cx="220" cy="450" r="0.8" fill="#ffffff" class="s1"/>
  <circle cx="580" cy="460" r="1" fill="#ffffff" class="s3"/>

